name: Automated Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace @dulceria/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend · Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace @dulceria/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
