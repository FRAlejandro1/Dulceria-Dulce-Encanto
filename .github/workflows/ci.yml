name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint:web
      - run: npm run type-check:web
      - run: npm run build:web

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint:api
      - run: npm run type-check:api
      - run: npm run build:api

  test-frontend:
    name: Frontend Unit Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:coverage --workspace @dulceria/web

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  test-backend:
    name: Backend Unit Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:coverage --workspace @dulceria/api

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  integration:
    name: HTTP Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Test Express HTTP behavior
        run: npm run test --workspace @dulceria/api -- tests/app.test.ts

  docker:
    name: Docker
    needs:
      - frontend
      - backend
      - test-frontend
      - test-backend
      - integration
    uses: ./.github/workflows/docker.yml

  sonarcloud:
    name: SonarCloud
    needs:
      - frontend
      - backend
      - test-frontend
      - test-backend
      - integration
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit
