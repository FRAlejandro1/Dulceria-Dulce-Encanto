name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Analizar código
        run: npm run lint

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run type-check

  test-api:
    name: Pruebas y cobertura API
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Publicar informe LCOV
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend y backend
        run: npm run build

      - name: Publicar frontend compilado
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Validación Docker
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Validar disponibilidad de Docker
        run: docker --version

      - name: Construir imagen frontend
        run: docker build --target frontend -t dulceria-dulce-encanto-frontend:${{ github.sha }} .

      - name: Construir imagen backend
        run: docker build --target backend -t dulceria-dulce-encanto-backend:${{ github.sha }} .

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - test-api
      - build
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar cobertura API
        uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_DULCERIA }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION_DULCERIA }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DULCERIA }}
