name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/frontend.yml

  backend:
    name: Backend
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend.yml

  unit-tests:
    name: Automated tests
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/unit-tests.yml

  docker:
    name: Docker
    needs:
      - frontend
      - backend
      - unit-tests
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml

  sonarcloud:
    name: SonarCloud
    needs:
      - frontend
      - backend
      - unit-tests
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit
