name: Backend Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Backend · Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Ejecutar pruebas y cobertura
        run: npm run test:coverage --workspace @dulceria/api

      - name: Guardar cobertura backend
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
