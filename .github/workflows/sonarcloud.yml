name: SonarCloud

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: SonarCloud · Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage

      - name: Validate SonarCloud configuration
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY_DULCERIA }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION_DULCERIA }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DULCERIA }}
        shell: bash
        run: |
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Project key vacío"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Organization vacía"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "::error::Token vacío"; exit 1; }

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_DULCERIA }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION_DULCERIA }}
            -Dsonar.branch.name=main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DULCERIA }}
